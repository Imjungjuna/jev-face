<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Jev face — a face that reacts to what you type</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <button id="settings-toggle" aria-label="Toggle telemetry panel">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="3.2" />
        <path d="M12 2.6v2.3M12 19.1v2.3M21.4 12h-2.3M4.9 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7 5.4 5.4" />
      </svg>
    </button>

    <aside id="panel">
      <div class="head-row"><span class="k">emotion</span><span class="v" id="em-name">—</span></div>
      <div class="head-row">
        <span class="k">intensity</span>
        <span class="bar"><i id="em-int-bar"></i></span>
        <span class="n" id="em-int">—</span>
      </div>
      <div class="head-row"><span class="k">score (0-4)</span><span class="v2" id="em-score">—</span></div>

      <h2>emotion probabilities</h2>
      <div id="emotion-rows"></div>

      <h2>intensity probabilities</h2>
      <div id="intensity-rows"></div>

      <h2>meta</h2>
      <div class="meta-row"><span class="k">confidence</span><span class="v2" id="m-conf">—</span></div>
      <div class="meta-row"><span class="k">latency</span><span class="v2" id="m-lat">—</span></div>
      <div class="meta-row"><span class="k">input tokens</span><span class="v2" id="m-tok">—</span></div>
      <div class="meta-row"><span class="k">requests</span><span class="v2" id="m-req">0</span></div>
      <div class="meta-row"><span class="k">failures</span><span class="v2" id="m-fail">0</span></div>

      <details id="raw">
        <summary>raw response JSON</summary>
        <pre id="raw-json">—</pre>
      </details>
    </aside>

    <div id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Type a message and watch them read it…"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      ></textarea>
      <div id="status"><i class="dot"></i><span id="status-text">waiting for input</span></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
