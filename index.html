<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Jev face — a face that reacts to what you type</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Fixed 1080x1272 aspect so the composition matches the reel at any window size. -->
    <div id="frame">
      <canvas id="stage"></canvas>

      <button id="settings-toggle" aria-label="Toggle telemetry panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="3.2" />
          <path d="M12 2.6v2.3M12 19.1v2.3M21.4 12h-2.3M4.9 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7 5.4 5.4" />
        </svg>
      </button>

      <aside id="panel">
        <div class="row">
          <span class="label">emotion</span>
          <span class="wide"><i class="dot" id="em-dot"></i><b id="em-name">—</b></span>
        </div>
        <div class="row">
          <span class="label">intensity</span>
          <span class="bar"><i id="em-int-bar"></i></span>
          <span class="num" id="em-int">—</span>
        </div>
        <div class="row">
          <span class="label">score (0–4)</span>
          <span class="wide" id="em-score">—</span>
        </div>

        <h2>emotion.probabilities</h2>
        <div id="emotion-rows"></div>

        <h2>intensity.probabilities</h2>
        <div id="intensity-rows"></div>

        <h2>meta</h2>
        <div class="row">
          <span class="label">confidence</span>
          <span class="wide" id="m-conf">—</span>
        </div>
        <div class="row"><span class="label">latency</span><span class="wide" id="m-lat">—</span></div>
        <div class="row"><span class="label">input tokens</span><span class="wide" id="m-tok">—</span></div>
        <div class="row"><span class="label">requests</span><span class="wide" id="m-req">0</span></div>
        <div class="row"><span class="label">failures</span><span class="wide" id="m-fail">0</span></div>

        <details id="raw">
          <summary>raw response JSON</summary>
          <pre id="raw-json">—</pre>
        </details>
      </aside>

      <div id="composer">
        <textarea
          id="input"
          placeholder="Type a message and watch them read it…"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>
        <div id="status"><i class="dot"></i><span id="status-text">waiting for input</span></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
